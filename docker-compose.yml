services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # backend/.env is the single local secrets file (gitignored). The two
    # entries below override its host-oriented DATABASE_URL / S3_ENDPOINT_URL
    # with the compose service names; the rest (S3 creds, GRAPH_*) come from it.
    env_file: backend/.env
    environment:
      - DATABASE_URL=postgresql://bike_trip:bike_trip@postgres:5432/bike_trip
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend # live-reload for local dev
      # Anonymous volume masks the host's Windows-shaped .venv (Scripts/, no
      # bin/) so the image's Linux venv stays visible. Must follow the bind mount.
      - /app/backend/.venv

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bike_trip
      - POSTGRES_PASSWORD=bike_trip
      - POSTGRES_DB=bike_trip
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike_trip"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
